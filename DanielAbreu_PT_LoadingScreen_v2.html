<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daniel Abreu PT — Loading Screen</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
  }
  .logo-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .glow-ring {
    position: absolute;
    width: 260px;
    height: 260px;
    border-radius: 50%;
    border: 2px solid #5682B1;
    opacity: 0;
    animation: ringPulse 2.4s ease-out infinite;
  }
  .glow-ring:nth-child(2) { animation-delay: 0.8s; }
  .glow-ring:nth-child(3) { animation-delay: 1.6s; }
  @keyframes ringPulse {
    0%   { transform: scale(0.6); opacity: 0.6; }
    100% { transform: scale(1.6); opacity: 0; }
  }
  .logo-svg {
    width: 300px;
    position: relative;
    z-index: 2;
    animation: logoAppear 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  @keyframes logoAppear {
    0%   { transform: scale(0.4) translateY(30px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }
  .letter-d { animation: letterIn 0.6s 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  .letter-a { animation: letterIn 0.6s 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  @keyframes letterIn {
    0%   { opacity: 0; transform: translateY(-20px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .bar-left  { transform-origin: right center; animation: barGrow 0.7s 0.7s ease-out both; }
  .bar-right { transform-origin: left center;  animation: barGrow 0.7s 0.7s ease-out both; }
  @keyframes barGrow {
    0%   { transform: scaleX(0); opacity: 0; }
    100% { transform: scaleX(1); opacity: 1; }
  }
  .plate-left  { animation: plateDrop 0.5s 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  .plate-right { animation: plateDrop 0.5s 1.3s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  @keyframes plateDrop {
    0%   { opacity: 0; transform: translateY(-30px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .scanlines {
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    pointer-events: none; z-index: 10;
  }
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="logo-wrap">
  <div class="glow-ring"></div>
  <div class="glow-ring"></div>
  <div class="glow-ring"></div>

  <svg class="logo-svg" viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg">
    <text class="letter-d" x="247" y="168" font-family="'Arial Black','Helvetica Neue',sans-serif" font-size="172" fill="#000000" text-anchor="middle">D</text>
    <text class="letter-a" x="433" y="168" font-family="'Arial Black','Helvetica Neue',sans-serif" font-size="172" fill="#000000" text-anchor="middle">A</text>

    <rect class="bar-left"  x="84"  y="94" width="256" height="15" rx="4" fill="#5682B1"/>
    <rect class="bar-left"  x="84"  y="94" width="256" height="4"  rx="2" fill="#739EC9" opacity="0.7"/>
    <rect class="bar-right" x="340" y="94" width="256" height="15" rx="4" fill="#5682B1"/>
    <rect class="bar-right" x="340" y="94" width="256" height="4"  rx="2" fill="#739EC9" opacity="0.7"/>
    <rect x="84" y="102" width="512" height="7" rx="3" fill="#000000" opacity="0.4"/>

    <line x1="307" y1="97" x2="307" y2="109" stroke="#000000" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="319" y1="97" x2="319" y2="109" stroke="#000000" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="331" y1="97" x2="331" y2="109" stroke="#000000" stroke-width="2"   stroke-opacity="0.5"/>
    <line x1="340" y1="97" x2="340" y2="109" stroke="#000000" stroke-width="2.5" stroke-opacity="0.5"/>
    <line x1="349" y1="97" x2="349" y2="109" stroke="#000000" stroke-width="2"   stroke-opacity="0.5"/>
    <line x1="361" y1="97" x2="361" y2="109" stroke="#000000" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="373" y1="97" x2="373" y2="109" stroke="#000000" stroke-width="1.5" stroke-opacity="0.5"/>

    <rect x="72"  y="88" width="12" height="27" rx="2" fill="#739EC9"/>
    <rect x="596" y="88" width="12" height="27" rx="2" fill="#739EC9"/>

    <g class="plate-left">
      <rect x="54" y="47" width="18" height="109" rx="3" fill="#5682B1"/>
      <rect x="54" y="47" width="18" height="109" rx="3" fill="none" stroke="#739EC9" stroke-width="0.75" stroke-opacity="0.5"/>
      <rect x="58" y="58" width="10" height="87"  rx="2" fill="#000000" opacity="0.5"/>
      <rect x="40" y="54" width="14" height="95"  rx="3" fill="#5682B1"/>
      <rect x="40" y="54" width="14" height="95"  rx="3" fill="none" stroke="#739EC9" stroke-width="0.75" stroke-opacity="0.5"/>
      <rect x="44" y="64" width="6"  height="75"  rx="1.5" fill="#000000" opacity="0.5"/>
    </g>

    <g class="plate-right">
      <rect x="608" y="47" width="18" height="109" rx="3" fill="#5682B1"/>
      <rect x="608" y="47" width="18" height="109" rx="3" fill="none" stroke="#739EC9" stroke-width="0.75" stroke-opacity="0.5"/>
      <rect x="612" y="58" width="10" height="87"  rx="2" fill="#000000" opacity="0.5"/>
      <rect x="626" y="54" width="14" height="95"  rx="3" fill="#5682B1"/>
      <rect x="626" y="54" width="14" height="95"  rx="3" fill="none" stroke="#739EC9" stroke-width="0.75" stroke-opacity="0.5"/>
      <rect x="630" y="64" width="6"  height="75"  rx="1.5" fill="#000000" opacity="0.5"/>
    </g>
  </svg>
</div>
</body>
</html>
